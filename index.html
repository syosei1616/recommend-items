<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おすすめ商品まとめ</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background-color: #f7f7f7;
    color: #333333;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    line-height: 1.7;
  }
  .card {
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    padding: 32px 24px;
    max-width: 480px;
    width: 90%;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 16px;
    color: #222222;
  }
  .status {
    font-size: 1.05rem;
    margin: 0 0 24px;
    color: #555555;
  }
  .disclosure {
    font-size: 0.85rem;
    color: #888888;
    border-top: 1px solid #eeeeee;
    padding-top: 16px;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>おすすめ商品まとめ</h1>
    <p class="status">現在ページを準備中です。</p>
    <p class="disclosure">当ページはアフィリエイト広告を利用しています。</p>
  </div>
</body>
</html>
