<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おすすめ商品まとめ</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f2f2;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }
    .pr-banner {
      margin: 0;
      padding: 10px 12px;
      background: #fff3cd;
      color: #7a5b00;
      font-weight: bold;
      text-align: center;
      font-size: 0.95rem;
    }
    .page-title {
      margin: 16px 12px 4px;
      text-align: center;
      font-size: 1.4rem;
    }
    .disclaimer {
      margin: 0 12px 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #666;
    }
    .category-heading {
      margin: 0 12px 8px;
      padding-left: 8px;
      font-size: 1.1rem;
      border-left: 4px solid #bf0000;
    }
    .items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin: 0 0 28px;
      padding: 0 12px;
    }
    .item {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      padding: 10px;
    }
    .item-image-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 8px;
      background: #f0f0f0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .item-image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .category-badge {
      align-self: flex-start;
      margin-bottom: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #ffe8e8;
      color: #bf0000;
      font-size: 0.7rem;
      font-weight: bold;
    }
    .item-name {
      margin-bottom: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      min-height: calc(0.9rem * 1.4 * 3);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .item-price {
      margin-bottom: 4px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #bf0000;
    }
    .item-shop {
      margin-bottom: 10px;
      font-size: 0.75rem;
      color: #666;
    }
    .item-button {
      display: block;
      margin-top: auto;
      padding: 10px 8px;
      border-radius: 6px;
      background: #bf0000;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
    }
    .no-link {
      display: block;
      margin-top: auto;
      padding: 10px 8px;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
    }
    footer {
      padding: 16px 12px 32px;
      text-align: center;
      font-size: 0.75rem;
      color: #888;
    }
</style>
</head>
<body>
<p class="pr-banner">当ページはアフィリエイト広告を利用しています</p>
<h1 class="page-title">おすすめ商品まとめ</h1>
<p class="disclaimer">価格や在庫は変更される場合があります。最新情報は楽天市場でご確認ください</p>
<section><h2 class="category-heading">美容</h2><div class="items">
      <div class="item">
        <div class="item-image-box"><img src="https://thumbnail.image.rakuten.co.jp/@0_mall/orbis-shop/cabinet/orbis_prd/93/_o0093.jpg?_ex=128x128" alt="オルビス ザ リンクルセラム 美容液 シワ 美白 ナイアシンアミド しわ ハリ そばかす スキンケア ORBIS 公式店" loading="lazy"></div>
        <span class="category-badge">美容</span>
        <div class="item-name">オルビス ザ リンクルセラム 美容液 シワ 美白 ナイアシンアミド しわ ハリ そばかす スキンケア ORBIS 公式店</div>
        <div class="item-price">4,950円</div>
        <div class="item-shop">オルビス公式 楽天市場店</div>
        <a class="item-button" href="https://hb.afl.rakuten.co.jp/hgc/g00txe1o.7qa2n60f.g00txe1o.7qa2oa6d/?pc=https%3A%2F%2Fitem.rakuten.co.jp%2Forbis-shop%2Fo0093%2F&amp;m=http%3A%2F%2Fm.rakuten.co.jp%2Forbis-shop%2Fi%2F10000787%2F&amp;rafcid=wsc_i_is_06f103fd-6844-4075-9600-c2429992b8eb" rel="nofollow sponsored noopener noreferrer" target="_blank">楽天市場で商品を見る</a>
      </div>
    </div></section>
<footer>価格や在庫は変更される場合があります。最新情報は楽天市場でご確認ください</footer>
</body>
</html>
